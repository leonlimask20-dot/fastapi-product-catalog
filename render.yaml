services:
  - type: web
    name: fastapi-product-catalog
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-catalog-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10

databases:
  - name: product-catalog-db
    region: oregon
    plan: free
